name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Web & Capacitor Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev

      - name: Build Web Application
        run: npm run build

      - name: Initialize and Sync Android Capacitor Project
        run: |
          npx cap init "AutoBrowser" "com.autobrowser.androidauto" --web-dir "dist"
          npx cap add android
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact for Download
        uses: actions/upload-artifact@v4
        with:
          name: AutoBrowser-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
